<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Caveat:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito', system-ui, sans-serif; }
    a { color: #336633; } a:hover { color: #448844; }
  </style>
</helmet>

<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: linear-gradient(180deg, #fcfcfb 0%, #eff0f7 100%); color: #44403c;">

  <div style="position: absolute; inset: 0; overflow: hidden; padding: 62px 20px 118px 20px;">

    <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 22px;">
      <div style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 18px; background: #e0e7ff; color: #4f46e5;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6.4 6.4 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </div>
      <div style="min-width: 0;">
        <h2 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: #44403c;">Сон</h2>
        <p style="margin: 2px 0 0 0; font-size: 13px; color: #78716c;">Ритм дня и ночи</p>
      </div>
    </div>

    <sc-if value="{{ sleeping }}" hint-placeholder-val="{{ true }}">
      <div style="border-radius: 32px; padding: 26px 22px; text-align: center; background: linear-gradient(to bottom right, #312e81, #1e293b); color: #ffffff; box-shadow: 0 22px 50px rgba(30,41,59,0.28); margin-bottom: 18px;">
        <div style="height: 118px; display: flex; align-items: center; justify-content: center; margin-bottom: 18px;">
          <svg width="112" height="112" viewBox="0 0 120 120" fill="none">
            <circle cx="60" cy="66" r="34" fill="rgba(255,255,255,0.10)"/>
            <path d="M40 66a20 20 0 0 1 40 0" stroke="rgba(199,210,254,0.9)" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M48 62c1.6 1.8 4.4 1.8 6 0" stroke="rgba(199,210,254,0.9)" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M66 62c1.6 1.8 4.4 1.8 6 0" stroke="rgba(199,210,254,0.9)" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M54 76c3.4 2.4 8.6 2.4 12 0" stroke="rgba(199,210,254,0.7)" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M78 34h13l-13 13h13" stroke="rgba(165,180,252,0.85)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M94 18h9l-9 9h9" stroke="rgba(165,180,252,0.55)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h3 style="margin: 0 0 10px 0; font-size: 24px; font-weight: 800;">Ева спит</h3>
        <div style="font-size: 42px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; color: #c7d2fe; margin-bottom: 22px;">1:24:06</div>
        <button style="width: 100%; min-height: 58px; display: flex; align-items: center; justify-content: center; gap: 10px; border: none; border-radius: 24px; background: rgba(255,255,255,0.2); color: #ffffff; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
          Проснулась
        </button>
      </div>
    </sc-if>

    <sc-if value="{{ awake }}" hint-placeholder-val="{{ false }}">
      <div style="border-radius: 32px; padding: 26px 22px; text-align: center; background: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 20px 60px rgba(15,12,41,0.10); margin-bottom: 18px;">
        <div style="height: 118px; display: flex; align-items: center; justify-content: center; margin-bottom: 18px;">
          <svg width="112" height="112" viewBox="0 0 120 120" fill="none">
            <circle cx="60" cy="64" r="34" fill="#f4f9f4"/>
            <circle cx="50" cy="60" r="3.2" fill="#448844"/>
            <circle cx="70" cy="60" r="3.2" fill="#448844"/>
            <path d="M52 74c4 3.6 12 3.6 16 0" stroke="#448844" stroke-width="2.8" stroke-linecap="round"/>
            <path d="M60 30v-6M44 34l-3-5M76 34l3-5" stroke="#98ca98" stroke-width="2.8" stroke-linecap="round"/>
          </svg>
        </div>
        <h3 style="margin: 0 0 22px 0; font-size: 24px; font-weight: 800; color: #44403c;">Ева не спит</h3>
        <button style="width: 100%; min-height: 58px; display: flex; align-items: center; justify-content: center; gap: 10px; border: none; border-radius: 24px; background: #4f46e5; color: #ffffff; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 12px 28px rgba(79,70,229,0.3);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 4.5v15l13-7.5-13-7.5Z"/></svg>
          Заснула
        </button>
      </div>
    </sc-if>

    <div style="display: flex; align-items: center; justify-content: space-between; border-radius: 28px; border: 1px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.75); box-shadow: 0 10px 30px rgba(15,12,41,0.06); padding: 16px 18px; margin-bottom: 18px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #dbeafe; color: #2563eb;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </div>
        <div>
          <p style="margin: 0; font-size: 14px; font-weight: 800; color: #44403c;">Сна за сегодня</p>
          <p style="margin: 2px 0 0 0; font-size: 12px; color: #a8a29e;">норма в 7 мес — 13–15 ч</p>
        </div>
      </div>
      <div style="font-size: 21px; font-weight: 800; color: #2563eb;">11 ч 20 м</div>
    </div>

    <p style="margin: 0 0 12px 0; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.18em; color: #a8a29e;">Сегодня</p>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; justify-content: space-between; border-radius: 22px; background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.6); padding: 13px 16px;">
        <div style="display: flex; align-items: center; gap: 11px;">
          <span style="width: 9px; height: 9px; border-radius: 50%; background: #4f46e5;"></span>
          <span style="font-size: 14px; font-weight: 700; color: #57534e;">13:40 — сейчас</span>
        </div>
        <span style="font-size: 14px; font-weight: 800; color: #4f46e5;">1 ч 24 м</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; border-radius: 22px; background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.6); padding: 13px 16px;">
        <div style="display: flex; align-items: center; gap: 11px;">
          <span style="width: 9px; height: 9px; border-radius: 50%; background: #c7d2fe;"></span>
          <span style="font-size: 14px; font-weight: 700; color: #57534e;">09:15 — 10:40</span>
        </div>
        <span style="font-size: 14px; font-weight: 800; color: #78716c;">1 ч 25 м</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; border-radius: 22px; background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.6); padding: 13px 16px;">
        <div style="display: flex; align-items: center; gap: 11px;">
          <span style="width: 9px; height: 9px; border-radius: 50%; background: #c7d2fe;"></span>
          <span style="font-size: 14px; font-weight: 700; color: #57534e;">21:30 — 06:00</span>
        </div>
        <span style="font-size: 14px; font-weight: 800; color: #78716c;">8 ч 30 м</span>
      </div>
    </div>

  </div>

  <div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 0 10px 22px 10px;">
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.82); backdrop-filter: blur(20px); box-shadow: 0 -10px 40px rgba(0,0,0,0.08); padding: 8px;">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; border-radius: 22px; color: #a8a29e;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg>
        <span style="font-size: 10px; font-weight: 700;">Главная</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; border-radius: 22px; color: #a8a29e;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1Z"/></svg>
        <span style="font-size: 10px; font-weight: 700;">Дневник</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; border-radius: 22px; color: #a8a29e;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2Z"/></svg>
        <span style="font-size: 10px; font-weight: 700;">Чат</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; border-radius: 22px; background: #eef2ff; color: #4f46e5;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6.4 6.4 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <span style="font-size: 10px; font-weight: 800;">Сон</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; border-radius: 22px; color: #a8a29e;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span style="font-size: 10px; font-weight: 700;">Ещё</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"sleeping":{"editor":"boolean","default":true,"section":"Состояние"}}'>
class Component extends DCLogic {
  renderVals() {
    const sleeping = this.props.sleeping ?? true;
    return { sleeping: sleeping, awake: !sleeping };
  }
}
</script>
</body>
</html>
