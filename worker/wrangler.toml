name = "littleguide-ai"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# GEMINI_API_KEY и APP_TOKEN — секреты, задаются `wrangler secret put`, в репозитории их нет.

[[unsafe.bindings]]
name = "RATE_BURST"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[unsafe.bindings]]
name = "RATE_GLOBAL"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
